name: wheelhomes_mobile
description: "Wheelhomes Mobile App - Real Estate & Service Management"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Auth
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # UI & Utilities
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.17
  image_picker: ^1.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
